<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Gửi đến Thảo</title>
    <meta
      name="description"
      content="Một món quà kỹ thuật số đặc biệt dành cho Thảo."
    />

    <!-- Google Fonts: Vietnamese-friendly Serif + Handwritten -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ═══════════ Background Sticker Container ═══════════ -->
    <div id="sticker-container"></div>

    <!-- ═══════════ Film Grain Overlay (SVG feTurbulence) ═══════════ -->
    <svg
      id="grain-overlay"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="none"
    >
      <filter id="noiseFilter">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.72"
          numOctaves="4"
          stitchTiles="stitch"
        />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>

    <!-- ═══════════ Vignette Overlay ═══════════ -->
    <div class="vignette-overlay"></div>

    <!-- ═══════════ Main Application ═══════════ -->
    <main id="app">
      <!-- ─────── State 1 & 2: Gift + Countdown / Unlock ─────── -->
      <section id="state-gift" class="state active">
        <p class="heading-text" id="heading">
          Gửi đến Thảo của những năm về sau...
        </p>

        <!-- ── Inline SVG Gift Box ── -->
        <div class="gift-box-wrapper">
          <svg
            viewBox="0 0 180 200"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Gift box"
          >
            <defs>
              <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#E8978F" />
                <stop offset="100%" stop-color="#CF706A" />
              </linearGradient>
              <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#EDA49C" />
                <stop offset="100%" stop-color="#D98880" />
              </linearGradient>
              <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#D4A854" />
                <stop offset="50%" stop-color="#F0CC72" />
                <stop offset="100%" stop-color="#D4A854" />
              </linearGradient>
            </defs>

            <!-- Shadow -->
            <ellipse
              class="box-shadow"
              cx="90"
              cy="190"
              rx="58"
              ry="6"
              fill="rgba(61,43,31,0.09)"
            />

            <!-- Box Body -->
            <g class="box-body-group">
              <rect
                x="25"
                y="98"
                width="130"
                height="88"
                rx="4"
                fill="url(#boxGrad)"
              />
              <!-- Side highlight -->
              <rect
                x="25"
                y="98"
                width="5"
                height="88"
                rx="2.5"
                fill="rgba(255,255,255,0.13)"
              />
              <!-- Vertical ribbon on body -->
              <rect
                x="78"
                y="98"
                width="24"
                height="88"
                fill="url(#ribbonGrad)"
                opacity="0.88"
              />
              <!-- Ribbon stitching lines -->
              <line
                x1="80"
                y1="98"
                x2="80"
                y2="186"
                stroke="rgba(180,140,60,0.3)"
                stroke-width="0.5"
                stroke-dasharray="3 3"
              />
              <line
                x1="100"
                y1="98"
                x2="100"
                y2="186"
                stroke="rgba(180,140,60,0.3)"
                stroke-width="0.5"
                stroke-dasharray="3 3"
              />
            </g>

            <!-- Lid -->
            <g class="box-lid">
              <rect
                x="18"
                y="78"
                width="144"
                height="24"
                rx="4"
                fill="url(#lidGrad)"
              />
              <!-- Lid top highlight -->
              <rect
                x="18"
                y="78"
                width="144"
                height="3"
                rx="1.5"
                fill="rgba(255,255,255,0.18)"
              />
              <!-- Vertical ribbon on lid -->
              <rect
                x="78"
                y="78"
                width="24"
                height="24"
                fill="url(#ribbonGrad)"
                opacity="0.88"
              />
              <!-- Horizontal ribbon on lid -->
              <rect
                x="18"
                y="85"
                width="144"
                height="12"
                fill="url(#ribbonGrad)"
                opacity="0.88"
              />
              <!-- Cross center (slightly darker) -->
              <rect
                x="78"
                y="85"
                width="24"
                height="12"
                fill="#D4A448"
                opacity="0.6"
              />
            </g>

            <!-- Bow -->
            <g class="ribbon-bow">
              <!-- Left loop -->
              <path
                d="M90,72 C90,72 63,52 60,63 C57,74 83,79 90,72Z"
                fill="#F0CC72"
              />
              <path
                d="M90,72 C90,72 68,58 66,65 C64,72 84,77 90,72Z"
                fill="#E0B852"
                opacity="0.5"
              />
              <!-- Right loop -->
              <path
                d="M90,72 C90,72 117,52 120,63 C123,74 97,79 90,72Z"
                fill="#F0CC72"
              />
              <path
                d="M90,72 C90,72 112,58 114,65 C116,72 96,77 90,72Z"
                fill="#E0B852"
                opacity="0.5"
              />
              <!-- Tails -->
              <path
                d="M84,76 Q76,90 70,96"
                stroke="#F0CC72"
                stroke-width="5"
                stroke-linecap="round"
                fill="none"
              />
              <path
                d="M96,76 Q104,90 110,96"
                stroke="#F0CC72"
                stroke-width="5"
                stroke-linecap="round"
                fill="none"
              />
              <!-- Center knot -->
              <circle cx="90" cy="72" r="6" fill="#C89E3C" />
              <circle cx="90" cy="72" r="3.5" fill="#D4A854" />
            </g>
          </svg>
        </div>

        <!-- ── Countdown Timer ── -->
        <div class="countdown-timer" id="timer">
          <div class="time-unit">
            <span id="cd-days">000</span>
            <small>Ngày</small>
          </div>
          <span class="separator">:</span>
          <div class="time-unit">
            <span id="cd-hours">00</span>
            <small>Giờ</small>
          </div>
          <span class="separator">:</span>
          <div class="time-unit">
            <span id="cd-minutes">00</span>
            <small>Phút</small>
          </div>
          <span class="separator">:</span>
          <div class="time-unit">
            <span id="cd-seconds">00</span>
            <small>Giây</small>
          </div>
        </div>

        <!-- ── Unlock Button (hidden until date reached) ── -->
        <button id="btn-unlock" class="unlock-btn">Mở Quà</button>
      </section>

      <!-- ── Particle Burst Container ── -->
      <div id="particles-container"></div>

      <!-- ── Light Transition Overlay ── -->
      <div id="light-overlay"></div>

      <!-- ─────── State 3: Cassette Tape ─────── -->
      <section id="state-cassette" class="state">
        <div class="cassette-wrapper">
          <svg
            viewBox="0 0 340 220"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Cassette tape"
          >
            <defs>
              <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3F3F3F" />
                <stop offset="100%" stop-color="#222222" />
              </linearGradient>
              <linearGradient id="labelGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FAF3E6" />
                <stop offset="100%" stop-color="#EDE3D0" />
              </linearGradient>
              <linearGradient id="tapeGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#5C3D1E" />
                <stop offset="50%" stop-color="#7A5230" />
                <stop offset="100%" stop-color="#5C3D1E" />
              </linearGradient>
            </defs>

            <!-- ── Main Shell ── -->
            <rect
              x="8"
              y="8"
              width="324"
              height="204"
              rx="11"
              fill="url(#shellGrad)"
              stroke="#1A1A1A"
              stroke-width="1.2"
            />

            <!-- Inner border detail -->
            <rect
              x="15"
              y="15"
              width="310"
              height="190"
              rx="8"
              fill="none"
              stroke="#4A4A4A"
              stroke-width="0.4"
            />

            <!-- ── Screw Holes ── -->
            <g fill="#1A1A1A" stroke="#555" stroke-width="0.4">
              <circle cx="27" cy="27" r="4" />
              <circle cx="27" cy="27" r="1.5" fill="#3A3A3A" stroke="none" />
              <circle cx="313" cy="27" r="4" />
              <circle cx="313" cy="27" r="1.5" fill="#3A3A3A" stroke="none" />
              <circle cx="27" cy="193" r="4" />
              <circle cx="27" cy="193" r="1.5" fill="#3A3A3A" stroke="none" />
              <circle cx="313" cy="193" r="4" />
              <circle cx="313" cy="193" r="1.5" fill="#3A3A3A" stroke="none" />
            </g>

            <!-- ── Side Grip Texture ── -->
            <g stroke="#4A4A4A" stroke-width="0.5">
              <line x1="13" y1="75" x2="13" y2="145" />
              <line x1="16" y1="75" x2="16" y2="145" />
              <line x1="19" y1="75" x2="19" y2="145" />
              <line x1="327" y1="75" x2="327" y2="145" />
              <line x1="324" y1="75" x2="324" y2="145" />
              <line x1="321" y1="75" x2="321" y2="145" />
            </g>

            <!-- ── Label Area ── -->
            <rect
              x="40"
              y="26"
              width="260"
              height="108"
              rx="5"
              fill="url(#labelGrad)"
              stroke="#D4C4B0"
              stroke-width="0.5"
            />

            <!-- Label decorative inner border -->
            <rect
              x="47"
              y="33"
              width="246"
              height="94"
              rx="3"
              fill="none"
              stroke="#D4C4B0"
              stroke-width="0.4"
              stroke-dasharray="2 2"
            />

            <!-- Label ruled lines -->
            <g stroke="#E2D8C8" stroke-width="0.4">
              <line x1="58" y1="54" x2="282" y2="54" />
              <line x1="58" y1="69" x2="282" y2="69" />
              <line x1="58" y1="84" x2="282" y2="84" />
              <line x1="58" y1="99" x2="282" y2="99" />
              <line x1="58" y1="114" x2="282" y2="114" />
            </g>

            <!-- Label type text -->
            <text
              x="170"
              y="48"
              text-anchor="middle"
              font-size="7"
              fill="#A89880"
              font-family="sans-serif"
              letter-spacing="4"
            >
              C - 6 0
            </text>

            <!-- Side marker -->
            <text
              x="54"
              y="76"
              font-size="7.5"
              fill="#B0A090"
              font-family="sans-serif"
              letter-spacing="1"
            >
              A ▸
            </text>

            <!-- ★ Main Label Text ★ -->
            <text
              x="170"
              y="92"
              text-anchor="middle"
              class="cassette-label-text"
              font-size="24"
              fill="#5C4033"
              font-family="'Dancing Script', cursive"
            >
              Tháng 8, 2026
            </text>
            
            <text
              x="170"
              y="110"
              text-anchor="middle"
              class="cassette-label-text"
              font-size="16"
              fill="#5C4033"
              font-family="'Dancing Script', cursive"
            >
              H.T.T
            </text>

            <!-- ── Tape Window ── -->
            <rect
              x="52"
              y="140"
              width="236"
              height="52"
              rx="26"
              fill="#1A1A1A"
              stroke="#3A3A3A"
              stroke-width="0.5"
            />
            <rect x="57" y="145" width="226" height="42" rx="21" fill="#111" />

            <!-- Tape between spools -->
            <path
              d="M125,166 Q170,150 215,166"
              fill="none"
              stroke="url(#tapeGrad)"
              stroke-width="1.8"
              opacity="0.6"
            />
            <path
              d="M125,166 Q170,182 215,166"
              fill="none"
              stroke="url(#tapeGrad)"
              stroke-width="1.8"
              opacity="0.6"
            />

            <!-- ── Left Spool ── -->
            <g id="spool-left" class="spool">
              <!-- Outer reel -->
              <circle
                cx="120"
                cy="166"
                r="23"
                fill="#353535"
                stroke="#444"
                stroke-width="0.5"
              />
              <!-- Hub -->
              <circle cx="120" cy="166" r="15" fill="#232323" />
              <!-- 6 Spokes -->
              <rect
                x="118"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
              />
              <rect
                x="118"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(60, 120, 166)"
              />
              <rect
                x="118"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(120, 120, 166)"
              />
              <rect
                x="118"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(180, 120, 166)"
              />
              <rect
                x="118"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(240, 120, 166)"
              />
              <rect
                x="118"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(300, 120, 166)"
              />
              <!-- Center pin -->
              <circle
                cx="120"
                cy="166"
                r="4.5"
                fill="#3A3A3A"
                stroke="#505050"
                stroke-width="0.4"
              />
              <circle cx="120" cy="166" r="2" fill="#555" />
            </g>

            <!-- ── Right Spool ── -->
            <g id="spool-right" class="spool">
              <circle
                cx="220"
                cy="166"
                r="23"
                fill="#353535"
                stroke="#444"
                stroke-width="0.5"
              />
              <circle cx="220" cy="166" r="15" fill="#232323" />
              <rect
                x="218"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
              />
              <rect
                x="218"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(60, 220, 166)"
              />
              <rect
                x="218"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(120, 220, 166)"
              />
              <rect
                x="218"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(180, 220, 166)"
              />
              <rect
                x="218"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(240, 220, 166)"
              />
              <rect
                x="218"
                y="151"
                width="4"
                height="8"
                rx="1"
                fill="#4E4E4E"
                transform="rotate(300, 220, 166)"
              />
              <circle
                cx="220"
                cy="166"
                r="4.5"
                fill="#3A3A3A"
                stroke="#505050"
                stroke-width="0.4"
              />
              <circle cx="220" cy="166" r="2" fill="#555" />
            </g>

            <!-- ── Bottom Guide Teeth ── -->
            <g fill="#1A1A1A" stroke="#333" stroke-width="0.4">
              <rect x="118" y="198" width="10" height="12" rx="2" />
              <rect x="140" y="198" width="10" height="12" rx="2" />
              <rect x="190" y="198" width="10" height="12" rx="2" />
              <rect x="212" y="198" width="10" height="12" rx="2" />
            </g>

            <!-- Bottom center slot -->
            <rect
              x="158"
              y="200"
              width="24"
              height="8"
              rx="3"
              fill="#1A1A1A"
              stroke="#333"
              stroke-width="0.3"
            />
          </svg>
        </div>

        <!-- ── Audio Controls ── -->
        <div class="audio-controls-wrapper">
          <div class="audio-buttons-row">
            <button
              id="btn-play-pause"
              aria-label="Play or pause voice message"
            ></button>
            <button
              id="btn-replay"
              aria-label="Replay voice message"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
            </button>
          </div>
          <div class="audio-progress-row">
            <div class="progress-container">
              <div class="progress-bar" id="voice-progress"></div>
            </div>
            <span id="voice-time">0:00</span>
          </div>
        </div>
        <!-- ── Subtitles ── -->
        <div id="subtitles-container"></div>
      </section>
    </main>

    <!-- ═══════════ BGM Toggle ═══════════ -->
    <button
      id="btn-bgm"
      class="bgm-toggle"
      aria-label="Toggle background music"
    ></button>

    <!-- ═══════════ Audio Elements ═══════════ -->
    <audio id="bgm" loop preload="auto" src="bg-music.mp3"></audio>
    <audio id="voice" preload="auto" src="voice.mp3"></audio>

    <script src="voice-script.js"></script>
    <script src="script.js"></script>
  </body>
</html>
